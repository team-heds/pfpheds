  <link rel="preload" as="image" href="/splash/logo.png">
  <style>
    /* Écran de chargement : identique à l'écran de démarrage, affiché jusqu'au
       premier rendu de l'application, puis retiré en fondu (src/utils/appSplash.js). */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: grid;
      place-items: center;
      background: #0B213F;
      transition: opacity 200ms ease-out;
    }
    #app-splash img {
      width: min(56vw, 240px);
      height: auto;
    }
    #app-splash.is-leaving {
      opacity: 0;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      #app-splash { transition: none; }
    }
    /* Application installée sur téléphone : elle se tient en portrait. En paysage,
       un écran couvre l'application sans la démonter (rien de ce qui est saisi
       n'est perdu). Ni les tablettes ni l'ordinateur ne sont concernés. */
    #rotate-hint {
      display: none;
    }
    @media (display-mode: standalone) and (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
      html:not(.allow-landscape) #rotate-hint {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: #0B213F;
        color: #f2f5fa;
        font: 600 17px/1.4 Poppins, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      html:not(.allow-landscape) #rotate-hint svg {
        width: 56px;
        height: 56px;
        color: #f3c300;
      }
      html:not(.allow-landscape) #rotate-hint small {
        font-weight: 400;
        font-size: 14px;
        color: #93a4bd;
      }
    }
  </style>
  <title>Plateforme - HEdS</title>
  <link href="/layout/styles/preloading/preloading.css" rel="stylesheet"/>
  <link id="theme-link" data-theme-link="heds" data-theme-scheme="dim" rel="stylesheet" href="./src/assets/theme/theme-dim/heds/theme.css" />
  <link data-theme-link="heds" data-theme-scheme="light" rel="stylesheet" href="./src/assets/theme/theme-light/heds/theme.css" media="not all" />
</head>

  <div id="rotate-hint" role="alert">

    <span>Tourne ton téléphone</span>
    <small>L’application s’utilise à la verticale.</small>
  </div>
