name: Production quality

on:
  pull_request:
    branches:
      - prod
  push:
    branches:
      - prod

permissions:
  contents: read

concurrency:
  group: production-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Security and quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create firebase.js from secrets
        run: |
          echo "import { initializeApp } from 'firebase/app';
          import { getDatabase } from 'firebase/database';
          import { getAuth } from 'firebase/auth';
          import { getStorage } from 'firebase/storage';
          import { get, ref } from 'firebase/database';

          const firebaseConfig = {
            apiKey: '${{ secrets.FIREBASE_API_KEY }}',
            authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
            databaseURL: '${{ secrets.FIREBASE_DATABASE_URL }}',
            projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
            storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
            messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
            appId: '${{ secrets.FIREBASE_APP_ID }}'
          };

          const app = initializeApp(firebaseConfig);
          const db = getDatabase(app);
          const auth = getAuth(app);
          const storage = getStorage(app);

          async function getUserNameById(userId) {
            const userRef = ref(db, \`Users/\${userId}\`);
            const snapshot = await get(userRef);
            if (snapshot.exists()) {
              const data = snapshot.val();
              const prenom = data.Prenom || '';
              const nom = data.Nom || '';
              return \`\${prenom} \${nom}\`.trim();
            } else {
              return '';
            }
          }

          const isFirebaseEnabled = true;

          export { db, auth, storage, isFirebaseEnabled, getUserNameById };
          " > firebase.js

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run P0 security tests
        run: npm run test:security

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=critical
          npm --prefix backend audit --omit=dev --audit-level=high
          npm --prefix documentation audit --omit=dev --audit-level=critical
          npm --prefix presentation audit --omit=dev --audit-level=critical

      - name: Install documentation dependencies
        run: npm ci --prefix documentation

      - name: Install presentation dependencies
        run: npm ci --prefix presentation

      - name: Install Playwright Chromium
        run: npm exec --prefix presentation -- playwright install --with-deps chromium

      - name: Validate frontend environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_KEY"
          test -n "$VITE_API_BASE_URL"

      - name: Build project and documentation
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_SUPABASE_REST_URL: ${{ secrets.VITE_SUPABASE_REST_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_VAPID_PUBLIC: ${{ secrets.VITE_VAPID_PUBLIC }}
        run: npm run build:all
